services:
  mock-llm:
    build: ./services/mock-llm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${AI_MODEL:-llama3.2:1b}
    entrypoint: ["sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://mock-llm:8088/v1}
      AI_MODEL: ${AI_MODEL:-demo}
      AI_API_KEY: ${AI_API_KEY:-unused}
    ports:
      - "3000:3000"
    depends_on:
      mock-llm:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 15s

  ext-proc:
    build: ./services/ext-proc
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(9000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  envoy-broken:
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.broken.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      web:
        condition: service_healthy
      ext-proc:
        condition: service_healthy

  envoy-fixed:
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.fixed.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8081:8080"
    depends_on:
      web:
        condition: service_healthy

volumes:
  ollama:
